; Bounded, resumable acquisition for the evaluation model.
; Runtime state deliberately stays on local storage, not /mnt/hdd1.
[unix_http_server]
file=/var/tmp/flexmem-1000/acquisition/supervisor.sock
chmod=0600

[supervisord]
logfile=/home/ymj/code/llm/FlexMem/artifacts/experiments/video-benchmark-lmms-eval/acquisition/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/var/tmp/flexmem-1000/acquisition/supervisord.pid
childlogdir=/home/ymj/code/llm/FlexMem/artifacts/experiments/video-benchmark-lmms-eval/acquisition
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/tmp/flexmem-1000/acquisition/supervisor.sock

[program:llava-video-7b-qwen2-download]
command=/home/ymj/.local/bin/uv run --locked --no-sync hf download lmms-lab/LLaVA-Video-7B-Qwen2 README.md added_tokens.json config.json generation_config.json merges.txt model-00001-of-00004.safetensors model-00002-of-00004.safetensors model-00003-of-00004.safetensors model-00004-of-00004.safetensors model.safetensors.index.json preprocessor_config.json special_tokens_map.json tokenizer.json tokenizer_config.json vocab.json --revision 013210b3aff822f1558b166d39c1046dd109520f --local-dir /mnt/hdd1/ymj/VLM/models/lmms-lab/LLaVA-Video-7B-Qwen2 --max-workers 4 --quiet
directory=/home/ymj/code/llm/FlexMem
environment=HF_ENDPOINT="https://hf-mirror.com",HF_HOME="/mnt/hdd1/ymj/VLM/models/.hf-home",PATH="/home/ymj/.local/bin:/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=false
startretries=0
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/home/ymj/code/llm/FlexMem/artifacts/experiments/video-benchmark-lmms-eval/acquisition/llava-video-7b-qwen2-download.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
